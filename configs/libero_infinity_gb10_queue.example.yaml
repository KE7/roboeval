# Example queue manifest for scripts/run_libero_infinity_gb10_queue.py.
# Run pilots first:
#   python3 scripts/run_libero_infinity_gb10_queue.py \
#       --manifest configs/libero_infinity_gb10_queue.example.yaml --mode pilot
#
# Scheduling policy for unified-memory hosts:
#   - On some unified-memory devices nvidia-smi reports utilization but leaves
#     the memory fields as N/A, so GPU memory cannot be used as the gate.
#   - Use pilot_metrics.json peak PSS/RSS together with the MemAvailable delta.
#   - Keep --max-parallel 1 until measured peaks leave enough headroom
#     (a 32 GiB MemAvailable floor is a reasonable starting point) after
#     projecting concurrent cells.

# Optional provenance block. Point libero_infinity_worktree at a local
# libero-infinity checkout when a run depends on generator/compiler/runtime
# fixes that live outside roboeval.
#
# provenance:
#   libero_infinity_worktree: /path/to/libero-infinity

cells:
  - name: position_only
    config: configs/libero_infinity_pi05_smoke.yaml
    suite: libero_infinity_goal
    perturbation: position
    episodes_per_task: 10
    max_tasks: 1

  - name: articulation_only
    config: configs/libero_infinity_pi05_smoke.yaml
    suite: libero_infinity_goal
    perturbation: articulation
    episodes_per_task: 10
    max_tasks: 1

  - name: position_plus_articulation
    config: configs/libero_infinity_pi05_smoke.yaml
    suite: libero_infinity_goal
    perturbation:
      - position
      - articulation
    episodes_per_task: 10
    max_tasks: 1

  - name: combined_axes
    config: configs/libero_infinity_pi05_smoke.yaml
    suite: libero_infinity_spatial,libero_infinity_goal
    perturbation: combined
    episodes_per_task: 10
    max_tasks: 2

  - name: all_axes
    config: configs/libero_infinity_pi05_smoke.yaml
    suite: libero_infinity_spatial,libero_infinity_goal
    perturbation: full
    episodes_per_task: 10
    max_tasks: 2
